[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spur-api"
version = "0.1.0"
description = "HTTP API service wrapping the spur mesoscopic railway simulation engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.0",
    # Installed from spur's main branch, which has the structured SimEvent
    # API. Move to a released version once spur publishes one.
    "spur @ git+https://github.com/spur-sim/spur.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["spur_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
