name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spur
          POSTGRES_PASSWORD: spur
          POSTGRES_DB: spur_api_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spur"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPUR_API_DATABASE_URL: postgresql+asyncpg://spur:spur@localhost:5432/spur_api_test
      SPUR_API_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - run: pytest -q
